# Cross-platform base configuration for Linux, Windows (Docker Desktop/WSL2),
# and macOS. It has no GPU requirement. Backend and frontend ports are
# published on loopback by default. Optional remote access uses the separate
# HTTPS gateway profile and is never a public-internet reverse proxy.
#
# Requires a .env file next to this one - copy .env.example and fill it in.
#
# GPU acceleration for the ollama service is opt-in, not required - add
# `-f docker-compose.gpu.yml` (Linux/Windows-WSL2 with an NVIDIA GPU only;
# see README.md). Without it, ollama still works, just CPU-only.

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-llmframework}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env - see .env.example}
      POSTGRES_DB: ${POSTGRES_DB:-llmframework}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-llmframework} -d ${POSTGRES_DB:-llmframework}"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      # Match the native-install tuning in scripts/configure-ollama.sh.
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: "q8_0"
    volumes:
      - ollama_data:/root/.ollama
    # CPU-only by default in this base file - see docker-compose.gpu.yml
    # for the NVIDIA device reservation overlay. Mac users wanting GPU
    # acceleration should run Ollama natively instead (Docker Desktop for
    # Mac cannot pass Metal through to containers) - see README.md.

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      # Keep credentials as separate values. The backend constructs a
      # structured SQLAlchemy URL so reserved password characters are not
      # mistaken for URL syntax.
      POSTGRES_USER: ${POSTGRES_USER:-llmframework}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env - see .env.example}
      POSTGRES_DB: ${POSTGRES_DB:-llmframework}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      APP_ACCESS_TOKEN: ${APP_ACCESS_TOKEN:?set APP_ACCESS_TOKEN in .env - see .env.example}
      # Override in .env to point at a native Ollama install instead of the
      # bundled container, e.g. http://host.docker.internal:11434 (Mac/
      # Windows Docker Desktop) - see README.md.
      OLLAMA_HOST: ${OLLAMA_HOST:-http://ollama:11434}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      REPOSITORY_MAX_ARCHIVE_BYTES: ${REPOSITORY_MAX_ARCHIVE_BYTES:-104857600}
      REPOSITORY_MAX_UNCOMPRESSED_BYTES: ${REPOSITORY_MAX_UNCOMPRESSED_BYTES:-524288000}
      REPOSITORY_MAX_MEMBERS: ${REPOSITORY_MAX_MEMBERS:-20000}
      REPOSITORY_MAX_FILE_BYTES: ${REPOSITORY_MAX_FILE_BYTES:-2097152}
      REPOSITORY_MAX_COMPRESSION_RATIO: ${REPOSITORY_MAX_COMPRESSION_RATIO:-100}
      REPOSITORY_RESULT_LIMIT: ${REPOSITORY_RESULT_LIMIT:-8}
      REPOSITORY_CHARACTER_LIMIT: ${REPOSITORY_CHARACTER_LIMIT:-12000}
      OPTIMIZER_CONTEXT_CEILING: ${OPTIMIZER_CONTEXT_CEILING:-65536}
      REMOTE_GATEWAY_SHARED_SECRET: ${REMOTE_GATEWAY_SHARED_SECRET:-}
      REMOTE_GATEWAY_PUBLIC_URL: ${REMOTE_GATEWAY_PUBLIC_URL:-https://localhost:8443}
      REMOTE_GATEWAY_BIND_ADDRESS: ${REMOTE_GATEWAY_BIND_ADDRESS:-127.0.0.1}
      REMOTE_GATEWAY_HOSTNAME: ${REMOTE_GATEWAY_HOSTNAME:-localhost}
      REMOTE_GATEWAY_CA_PATH: /gateway-data/caddy/pki/authorities/local/root.crt
      REMOTE_API_DEFAULT_RATE_LIMIT: ${REMOTE_API_DEFAULT_RATE_LIMIT:-30}
      REMOTE_API_MAX_INPUT_CHARACTERS: ${REMOTE_API_MAX_INPUT_CHARACTERS:-100000}
      REMOTE_API_MAX_BODY_BYTES: ${REMOTE_API_MAX_BODY_BYTES:-1000000}
      REMOTE_API_MAX_CONCURRENT_GENERATIONS: ${REMOTE_API_MAX_CONCURRENT_GENERATIONS:-1}
      REMOTE_API_FAILED_AUTH_LIMIT: ${REMOTE_API_FAILED_AUTH_LIMIT:-10}
      LOCAL_OPENAI_BASE_URL: ${LOCAL_OPENAI_BASE_URL:-}
      LOCAL_OPENAI_API_KEY: ${LOCAL_OPENAI_API_KEY:-}
      LOCAL_OPENAI_PROVIDER_NAME: ${LOCAL_OPENAI_PROVIDER_NAME:-Local OpenAI-compatible runtime}
      ALLOW_PUBLIC_MODEL_ENDPOINTS: ${ALLOW_PUBLIC_MODEL_ENDPOINTS:-false}
    depends_on:
      postgres:
        condition: service_healthy
    # Ollama is intentionally not a hard Compose dependency. The setup launcher
    # may connect the backend to a native or remote Ollama endpoint and starts
    # the bundled Ollama service explicitly only when that mode is selected.
    # A normal unqualified `docker compose up` still starts every service.
    extra_hosts:
      # Makes native-host Ollama reachable from Linux containers too. Docker
      # Desktop already provides this name on macOS and Windows.
      - "host.docker.internal:host-gateway"
    volumes:
      - backend_storage:/app/storage
      - gateway_data:/gateway-data:ro
    networks:
      - default
      - gateway_internal
    ports:
      - "${BACKEND_BIND_ADDRESS:-127.0.0.1}:8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_BIND_ADDRESS:-127.0.0.1}:3000:3000"

  # Starts only with: docker compose --profile remote up -d gateway
  # The backend also requires the saved access mode to be enabled, so a
  # leftover gateway container cannot silently turn remote access back on.
  gateway:
    image: caddy:2.10-alpine
    profiles: ["remote"]
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      REMOTE_GATEWAY_HOSTNAME: ${REMOTE_GATEWAY_HOSTNAME:-localhost}
      REMOTE_GATEWAY_SHARED_SECRET: ${REMOTE_GATEWAY_SHARED_SECRET:-}
    volumes:
      - ./gateway/Caddyfile:/etc/caddy/Caddyfile:ro
      - gateway_data:/data
      - gateway_config:/config
    networks:
      - gateway_internal
    ports:
      - "${REMOTE_GATEWAY_BIND_ADDRESS:-127.0.0.1}:${REMOTE_GATEWAY_PORT:-8443}:443"

volumes:
  postgres_data:
  ollama_data:
  backend_storage:
  gateway_data:
  gateway_config:

networks:
  gateway_internal:
    # A fully `internal: true` Docker network cannot publish the gateway port
    # on Docker Desktop. Isolation instead comes from attaching only backend
    # and gateway to this dedicated network; PostgreSQL and Ollama remain on
    # the default network and Caddy has a fixed, non-arbitrary proxy target.
